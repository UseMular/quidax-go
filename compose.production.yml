services:
  datadb:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-mysql:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quidax-go}
      MYSQL_USER: ${MYSQL_USER:-quidax}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  tigerbeetle:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-tigerbeetle:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      TIGERBEETLE_CACHE_GRID: ${TIGERBEETLE_CACHE_GRID:-256MiB}
    volumes:
      - tigerbeetle_data:/var/lib/tigerbeetle
    networks:
      - backend
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined

  app:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DATA_DB_URL: datadb:3306
      DATA_DB_NAME: ${MYSQL_DATABASE:-quidax-go}
      DATA_DB_USER: ${MYSQL_USER:-quidax}
      DATA_DB_PASSWORD_FILE: /run/secrets/mysql_password
      TX_DB_URL: tigerbeetle:3000
      PORT: :8080
    secrets:
      - mysql_password
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-55059}:8080"
    networks:
      - backend
    depends_on:
      datadb:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined

volumes:
  mysql_data:
  tigerbeetle_data:

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME:-quidax_backend}

secrets:
  mysql_password:
    file: ./secrets/mysql_password
  mysql_root_password:
    file: ./secrets/mysql_root_password
